name: CI/CD Pipeline & AWS EC2 Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # ============================================================================
  # Job 1: Test & Build Application
  # Runs unit and integration tests. Stops pipeline immediately if any test fails.
  # ============================================================================
  test:
    name: Run Tests & Build App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Unit & Integration Tests
        run: ./mvnw clean test

      - name: Package Application JAR
        run: ./mvnw package -DskipTests

  # ============================================================================
  # Job 2: Build & Push Docker Image to Docker Hub
  # Executed ONLY if Job 1 (test) succeeds on main branch push.
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Image to Docker Hub
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/smart-support-ticket-system
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Job 3: Deploy Container to AWS EC2 via SSH
  # Executed ONLY if Job 2 (Docker push) succeeds on main branch push.
  # ============================================================================
  deploy:
    name: Deploy Container to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull latest image from Docker Hub
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/smart-support-ticket-system:latest

            # Stop and remove existing running container if it exists
            docker stop smart-ticket-app || true
            docker rm smart-ticket-app || true

            # Run new container on port 8082
            docker run -d --name smart-ticket-app --restart unless-stopped -p 8082:8082 ${{ secrets.DOCKERHUB_USERNAME }}/smart-support-ticket-system:latest

            # Clean up old unused images on EC2
            docker image prune -f
